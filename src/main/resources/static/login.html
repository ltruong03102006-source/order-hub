<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderHub - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200 w-full max-w-md">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-indigo-600">OrderHub OMS</h1>
        <p class="text-slate-500 text-sm mt-1">Đăng nhập hệ thống nội bộ OrderHub</p>
    </div>
    <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Username</label>
            <input id="username" type="text" value="admin" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Password</label>
            <input id="password" type="password" value="admin123" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition text-sm">
            Đăng Nhập
        </button>
    </form>
    <div id="loginError" class="hidden mt-4 p-3 bg-rose-50 text-rose-600 text-xs rounded-lg text-center font-medium"></div>
</div>

<script>
    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const json = await res.json();
            if (res.ok && json.data?.token) {
                localStorage.setItem('token', json.data.token);
                localStorage.setItem('username', json.data.username || username);
                localStorage.setItem('role', json.data.role || 'STAFF');
                if (json.data.userId || json.data.id) {
                    localStorage.setItem('userId', json.data.userId || json.data.id);
                }
                window.location.href = '/index.html';
            } else {
                errorDiv.innerText = json.message || 'Sai tên đăng nhập hoặc mật khẩu';
                errorDiv.classList.remove('hidden');
            }
        } catch (err) {
            errorDiv.innerText = 'Không thể kết nối đến máy chủ!';
            errorDiv.classList.remove('hidden');
        }
    }
</script>
</body>
</html>
